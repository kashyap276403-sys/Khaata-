name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # SQLite library needed by the desktop-side database tests.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # Generate the Android platform folder on the first run only, in a
      # temp dir, and copy just android/ so our own files are never touched.
      # applicationId becomes com.aurax.khaata (must never change later).
      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org com.aurax --project-name khaata --platforms android "$RUNNER_TEMP/khaata_gen"
            cp -r "$RUNNER_TEMP/khaata_gen/android" ./android
          fi

      - run: flutter pub get

      # Non-blocking for now; will become strict once the code is stable.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      # Errors and warnings fail the build; style hints (infos) do not.
      # On failure the key lines are also written as annotations so they can
      # be read without opening the raw log.
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          rc=$?
          cat analyze.txt
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "(error|warning) •" analyze.txt | head -15 | sed 's/%/%25/g' | tr '\n' '|')
            echo "::error title=analyze failed::${msg}"
          fi
          exit $rc

      - name: Test
        run: |
          set +e
          flutter test > test.txt 2>&1
          rc=$?
          tail -80 test.txt
          last=$(grep -vE '^\s*$' test.txt | tail -1 | sed 's/%/%25/g')
          if [ $rc -ne 0 ]; then
            msg=$(grep -A10 -E '❌|EXCEPTION CAUGHT|Some tests failed' test.txt | grep -vE '^\s*$' | head -50 | sed 's/%/%25/g' | tr '\n' '|')
            [ -z "$msg" ] && msg=$(grep -vE '^\s*$' test.txt | tail -30 | sed 's/%/%25/g' | tr '\n' '|')
            echo "::error title=tests failed::${msg}"
          else
            echo "::notice title=tests::${last}"
          fi
          exit $rc

      - name: Build debug APK
        run: |
          set +e
          flutter build apk --debug > build.txt 2>&1
          rc=$?
          tail -40 build.txt
          if [ $rc -ne 0 ]; then
            msg=$(grep -vE '^\s*$' build.txt | tail -25 | sed 's/%/%25/g' | tr '\n' '|')
            echo "::error title=build failed::${msg}"
          fi
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: khaata-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # After the APK is safely uploaded: apply dart format and commit the
      # generated android/ folder once, so the applicationId stays fixed in
      # the repo. Any failure is reported as a warning annotation only.
      - name: Commit android folder and formatting
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set +e
          commit_back() {
            dart format lib test &&
            git config user.name "github-actions[bot]" &&
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com" &&
            git add android lib test &&
            if git diff --cached --quiet; then
              echo "Nothing to commit"
            else
              git commit -m "chore: add generated android folder and dart format" &&
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" &&
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          }
          out=$(commit_back 2>&1)
          rc=$?
          git status --short | head -5 >> /dev/null
          echo "$out"
          if [ $rc -ne 0 ]; then
            msg=$(echo "$out" | tail -8 | sed 's/%/%25/g' | tr '\n' '|')
            echo "::warning title=auto-commit failed (rc=${rc})::${msg}"
            exit $rc
          fi

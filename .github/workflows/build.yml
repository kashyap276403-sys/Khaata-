name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: auraX-Guard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish test APK (direct download link)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk auraX-Guard-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build auraX-Guard-test.apk --prerelease \
            --title "auraX Guard test build" \
            --notes "Debug test APK built from commit $GITHUB_SHA. For testing only." \
            --target "$GITHUB_SHA"

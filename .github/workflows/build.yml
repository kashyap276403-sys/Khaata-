name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # SQLite library needed by the desktop-side database tests.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # Generate the Android platform folder on the first run only, in a
      # temp dir, and copy just android/ so our own files are never touched.
      # applicationId becomes com.aurax.khaata (must never change later).
      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org com.aurax --project-name khaata --platforms android "$RUNNER_TEMP/khaata_gen"
            cp -r "$RUNNER_TEMP/khaata_gen/android" ./android
          fi

      - run: flutter pub get

      # Non-blocking for now; will become strict once the code is stable.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      # Errors and warnings fail the build; style hints (infos) do not yet.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      # After a green build: apply dart format and commit the generated
      # android/ folder once, so the applicationId stays fixed in the repo.
      # (Pushes made with GITHUB_TOKEN do not trigger another run.)
      - name: Commit android folder and formatting
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          dart format lib test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android lib test
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: add generated android folder and dart format"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: khaata-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
